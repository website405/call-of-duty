[data-fr="fire"] .frame{border-image:linear-gradient(90deg,#ff0000,#ff7a00,#ffd000,#ff7a00,#ff0000) 1;animation:none}

.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto;min-width:0}
.brand img{width:38px;height:38px;border-radius:9px;object-fit:cover;border:1px solid var(--acc)}
.logo{font-weight:900;letter-spacing:2px;font-size:16px;white-space:nowrap}.logo b{color:var(--acc)}
@media(max-width:430px){.logo{display:none}}
.ctl{position:relative}
.ib{background:var(--panel);color:var(--text);border:1px solid var(--bd);border-radius:10px;height:40px;padding:0 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.ib:hover{border-color:var(--acc)}

.mode.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--acc)}
.drawer{position:fixed;top:0;inset-inline-start:-300px;width:280px;height:100%;background:var(--hd);z-index:40;padding:80px 18px 20px;border-inline-end:2px solid var(--acc);transition:inset-inline-start .3s}
.drawer.open{inset-inline-start:0}
.drawer button{display:block;width:100%;text-align:start;background:var(--panel);color:var(--text);border:1px solid var(--bd);padding:14px;margin-bottom:10px;border-radius:10px;font-size:15px;cursor:pointer}
.drawer button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:22px 18px 40px;position:relative;z-index:5}
section.view{display:none}section.view.on{display:block}
.hero{text-align:center;padding:26px 10px 18px;background:var(--panel);border-radius:16px;border:1px solid var(--bd);overflow:hidden}
.hero h1{font-size:clamp(28px,7vw,52px);margin:0 0 8px;text-transform:uppercase;letter-spacing:3px;background:linear-gradient(90deg,#ffb300,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 0 14px}
.sl{position:relative;height:min(46vw,260px);min-height:170px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(255,179,0,.25),rgba(0,0,0,.55))}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .8s}
.sl img.on{opacity:1}
.slc{margin-top:10px;font-weight:800;color:var(--acc);letter-spacing:1px;min-height:22px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd);cursor:pointer}
.dots i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.actw{margin-top:18px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 0;overflow:hidden}
.actw small{display:block;text-align:center;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-size:11px;margin-bottom:10px}
.mq{overflow:hidden;direction:ltr}
.trk{display:flex;gap:16px;width:max-content;animation:mq 22s linear infinite}
.trk div{background:#fff;border-radius:10px;padding:8px 22px;display:flex;align-items:center;flex:none}
.trk img{height:30px;width:auto;display:block}
@keyframes mq{to{transform:translateX(-50%)}}
h2{margin:30px 0 12px;text-transform:uppercase;letter-spacing:2px;font-size:18px;border-inline-start:4px solid var(--acc);padding-inline-start:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:0 10px 26px rgba(255,140,0,.25)}
.card .im{height:110px;border-radius:10px;overflow:hidden;background:radial-gradient(circle,rgba(255,179,0,.2),rgba(0,0,0,.45));display:grid;place-items:center}
.card .im img{width:100%;height:100%;object-fit:contain}
.card h3{margin:10px 0 2px;font-size:16px}.card small{color:var(--mut)}

.scroll{overflow-x:auto}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;line-height:1.6}
input,select{background:var(--inp);color:var(--text);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 6px 4px 0;font-size:14px}

.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,179,0,.18);color:var(--acc);font-size:12px;font-weight:700}

.fine{color:var(--mut);font-size:12px}

/* ===== 3. Data ===== */
var W=[["AK117","ak117","wt_ar"],["AK-47","ak47","wt_ar"],["DL Q33","dl","wt_sn"],["M4","m4","wt_ar"],["BAL-27","bal","wt_ar"],["Static-HV","static","wt_sn"],["ISO Hemlock","iso","wt_ar"],["Grau 5.56","grau","wt_ar"]];
var P=[["ShadowViper","I",2.9,"AK-47"],["NovaStrike","I",2.7,"DL Q33"],["IronWolf","II",2.5,"M4"],["GhostMamba","II",2.4,"Grau 5.56"],["BlazeKing","III",2.2,"BAL-27"]];
function render(){
  $("wg").innerHTML=W.map(function(w){return'<div class="card"><div class="im"><img src="'+IMG[w[1]]+'" alt="'+w[0]+'" loading="lazy" onerror="hide(this)"></div><h3>'+w[0]+'</h3><small>'+tr(w[2])+' · '+tr("r_myth")+'</small></div>'}).join("");
  $("tb").innerHTML=P.map(function(p,x){return"<tr><td>"+(x+1)+"</td><td>"+p[0]+"</td><td><span class=tag>"+tr("lvl")+" "+p[1]+"</span></td><td>"+p[2]+"</td><td>"+p[3]+"</td></tr>"}).join("");
}
$("w").innerHTML=W.map(function(w){return"<option>"+w[0]+"</option>"}).join("");
$("add").onclick=function(){var n=$("n").value.trim();if(!n)return;P.push([n,"V",parseFloat($("k").value)||1,$("w").value]);P.sort(function(a,b){return b[2]-a[2]});render();$("n").value=""};

/* ===== 4. Logos + sliders ===== */
$("hl").src=IMG.logoHeader;$("hl").onerror=function(){hide(this)};
$("fl").src=IMG.logoFooter;$("fl").onerror=function(){hide(this)};
var act="";for(var q=0;q<12;q++)act+='<div><img src="'+IMG.activision+'" alt="Activision" onerror="hide(this)"></div>';
$("trk").innerHTML=act;

var si=0,sd=null;
$("sl").innerHTML=W.map(function(w,i){return'<img class="'+(i?"":"on")+'" src="'+IMG[w[1]]+'" alt="'+w[0]+'" onerror="hide(this)">'}).join("");
$("dots").innerHTML=W.map(function(w,i){return'<i data-s="'+i+'" class="'+(i?"":"on")+'"></i>'}).join("");
function show(n){si=(n+W.length)%W.length;
  var im=$("sl").children,ds=$("dots").children;
  for(var i=0;i<im.length;i++){im[i].classList.toggle("on",i==si);ds[i].classList.toggle("on",i==si)}
  $("slc").textContent=W[si][0]}
$("dots").onclick=function(e){if(e.target.dataset.s!==undefined){show(+e.target.dataset.s);auto()}};
function auto(){clearInterval(sd);sd=setInterval(function(){show(si+1)},3500)}
show(0);auto();

/* ===== 5. Language switch ===== */
var SH={en:"EN",ko:"KO",de:"DE",fa:"FA"};
function setLang(l){
  cur=T[l]?l:"en";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr(e.dataset.i)});
  $("n").placeholder=tr("pn");
  root.lang=cur;root.dir=cur=="fa"?"rtl":"ltr";$("lcur").textContent=SH[cur];
  document.querySelectorAll(".lg").forEach(function(b){b.classList.toggle("on",b.dataset.l==cur)});
  try{render()}catch(e){console.error(e)}
  sv("codm_l",cur);
}
document.querySelectorAll(".lg").forEach(function(b){b.onclick=function(){setLang(b.dataset.l);$("lp").classList.remove("on")}});

/* ===== 6. Start ===== */
try{setMode(ld("codm_m")||"dark")}catch(e){}
try{setFr(ld("codm_f")||"rainbow")}catch(e){}
setLang(ld("codm_l")||"en");
</script></body></html>

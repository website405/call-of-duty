<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fr="rainbow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODM Legends Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a0d0a;--panel:rgba(12,16,12,.82);--text:#eef3ea;
--mut:#9aa89a;--acc:#ffb300;--bd:#2b3a2b;--hd:rgba(6,9,6,.94);
--inp:#0e150e;--c1:#10160f;--c2:#161d13;--c3:#0c110b;
--g1:rgba(80,110,60,.35);--g2:rgba(120,60,20,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="light"]{
--bg:#e9efe3;--panel:rgba(255,255,255,.88);--text:#14210f;
--mut:#566554;--acc:#c46f00;--bd:#b9c7b0;--hd:rgba(255,255,255,.95);
--inp:#fff;--c1:#dfe8d6;--c2:#e9f0e2;--c3:#d6e1cc;
--g1:rgba(120,170,90,.35);--g2:rgba(230,150,60,.3)
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
margin:0;color:var(--text);
font-family:"Segoe UI",Roboto,Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at 20% 15%,var(--g1),transparent 40%),
radial-gradient(circle at 80% 70%,var(--g2),transparent 45%),
repeating-linear-gradient(35deg,var(--c1) 0 40px,var(--c2) 40px 80px,var(--c3) 80px 120px),var(--bg)
}
.frame{
position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;
border:solid;border-width:6px 6px 0 6px;
border-image:linear-gradient(90deg,#ff004c,#ff9500,#ffee00,#00ff6a,#00d5ff,#7a5cff,#ff00d4,#ff004c) 1;
pointer-events:none;z-index:50;animation:hue 5s linear infinite;
transform:translateZ(0);will-change:filter
}
[data-fr="fire"] .frame{border-image:linear-gradient(90deg,#ff0000,#ff7a00,#ffd000,#ff7a00,#ff0000) 1;animation:none}
[data-fr="ice"] .frame{border-image:linear-gradient(90deg,#00e5ff,#2979ff,#e0f7ff,#2979ff,#00e5ff) 1;animation:none}
[data-fr="toxic"] .frame{border-image:linear-gradient(90deg,#39ff14,#b6ff00,#00ff9d,#b6ff00,#39ff14) 1;animation:none}
[data-fr="gold"] .frame{border-image:linear-gradient(90deg,#ffd700,#b8860b,#fff3b0,#b8860b,#ffd700) 1;animation:none}
[data-fr="purple"] .frame{border-image:linear-gradient(90deg,#7a5cff,#ff00d4,#7a5cff) 1;animation:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}

header{
position:sticky;top:env(safe-area-inset-top,0px);z-index:45;
display:flex;align-items:center;gap:10px;padding:10px 18px;
background:var(--hd);backdrop-filter:blur(8px);
border-bottom:1px solid var(--bd)
}

.burger{
position:relative;background:none;border:1px solid var(--bd);border-radius:8px;
width:44px;height:40px;display:flex;flex-direction:column;
justify-content:center;gap:5px;padding:0 10px;cursor:pointer;flex:none;
transition:transform .4s,background .3s,border-color .3s,box-shadow .3s;
animation:bp 2.6s infinite
}
.burger i{
display:block;width:100%;height:3px;background:var(--acc);border-radius:2px;
transition:transform .35s cubic-bezier(.7,0,.2,1),opacity .25s,width .3s,background .3s
}
.burger i:nth-child(2){width:70%;margin-inline-start:auto}
.burger:hover{border-color:var(--acc);box-shadow:0 0 14px var(--acc)}
.burger:hover i:nth-child(2){width:100%}
.burger:active{transform:scale(.88)}
.burger.open{animation:none;background:var(--acc);border-color:var(--acc);transform:rotate(180deg)}
.burger.open i{background:#111;width:100%}
.burger.open i:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0;transform:scaleX(0)}
.burger.open i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@keyframes bp{
0%{box-shadow:0 0 0 0 rgba(255,179,0,.55)}
70%{box-shadow:0 0 0 12px rgba(255,179,0,0)}
100%{box-shadow:0 0 0 0 rgba(255,179,0,0)}
}

.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto;min-width:0}
.brand img{width:38px;height:38px;border-radius:9px;object-fit:cover;border:1px solid var(--acc)}
.logo{font-weight:900;letter-spacing:2px;font-size:16px;white-space:nowrap}
.logo b{color:var(--acc)}
@media(max-width:430px){.logo{display:none}}

.ctl{position:relative}
.ib{
background:var(--panel);color:var(--text);border:1px solid var(--bd);
border-radius:10px;height:40px;padding:0 12px;font-size:14px;
cursor:pointer;display:flex;align-items:center;gap:6px
}
.ib:hover{border-color:var(--acc)}
.pop{
display:none;position:absolute;top:48px;inset-inline-end:0;
min-width:170px;background:var(--hd);border:1px solid var(--acc);
border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)
}
.pop.on{display:block}
.pop button.lg{
display:block;width:100%;text-align:start;background:none;
color:var(--text);border:0;padding:10px;border-radius:8px;font-size:14px;cursor:pointer
}
.pop button.lg:hover,.pop button.lg.on{background:var(--acc);color:#111;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:10px}
.row:last-child{margin:0}
.mode{
flex:1;background:var(--panel);color:var(--text);
border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:18px;cursor:pointer
}
.mode.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--acc)}

.ov{
position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
opacity:0;visibility:hidden;transition:.3s;z-index:30
}
.ov.on{opacity:1;visibility:visible}
.drawer{overflow-y:auto;
position:fixed;top:0;inset-inline-start:-300px;width:280px;bottom:0;
background:var(--hd);z-index:40;padding:18px;border-top:1px solid var(--bd);
border-inline-end:2px solid var(--acc);transition:inset-inline-start .3s
}
.drawer.open{inset-inline-start:0}
.drawer button{
display:block;width:100%;text-align:start;background:var(--panel);
color:var(--text);border:1px solid var(--bd);padding:14px;
margin-bottom:10px;border-radius:10px;font-size:15px;cursor:pointer;
opacity:0;transform:translateX(-34px);
transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .35s,border-color .2s,color .2s,box-shadow .2s
}
[dir=rtl] .drawer button{transform:translateX(34px)}
.drawer.open button{opacity:1;transform:none}
.drawer button:nth-child(1){transition-delay:.12s}
.drawer button:nth-child(2){transition-delay:.19s}
.drawer button:nth-child(3){transition-delay:.26s}
.drawer button:nth-child(4){transition-delay:.33s}
.drawer button:hover{border-color:var(--acc);color:var(--acc);transform:translateX(6px);box-shadow:0 0 16px rgba(255,179,0,.3);transition-delay:0s}
[dir=rtl] .drawer button:hover{transform:translateX(-6px)}

main{max-width:1000px;margin:0 auto;padding:22px 18px 40px;position:relative;z-index:5}
section.view{display:none}
section.view.on{display:block}

.hero{
text-align:center;padding:26px 10px 18px;background:var(--panel);
border-radius:16px;border:1px solid var(--bd);overflow:hidden
}
.hero h1{
font-size:clamp(28px,7vw,52px);margin:0 0 8px;text-transform:uppercase;letter-spacing:3px;
background:linear-gradient(90deg,#ffb300,#ff4d00);
-webkit-background-clip:text;background-clip:text;color:transparent
}
.hero p{color:var(--mut);margin:0 0 14px}
.sl{
position:relative;height:min(46vw,260px);min-height:170px;border-radius:14px;overflow:hidden;
background:radial-gradient(circle at 50% 50%,rgba(255,179,0,.25),rgba(0,0,0,.55))
}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .8s}
.sl img.on{opacity:1}
.slc{margin-top:10px;font-weight:800;color:var(--acc);letter-spacing:1px;min-height:22px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd);cursor:pointer}
.dots i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}

.actw{margin-top:18px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 0;overflow:hidden}
.actw small{display:block;text-align:center;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-size:11px;margin-bottom:10px}
.mq{overflow:hidden;direction:ltr}
.trk{display:flex;gap:16px;width:max-content;animation:mq 22s linear infinite}
.trk div{background:#fff;border-radius:10px;padding:8px 22px;display:flex;align-items:center;flex:none}
.trk img{height:30px;width:auto;display:block}
@keyframes mq{to{transform:translateX(-50%)}}

h2{
margin:30px 0 12px;text-transform:uppercase;letter-spacing:2px;font-size:18px;
border-inline-start:4px solid var(--acc);padding-inline-start:10px
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{
background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;
transition:transform .25s,border-color .25s,box-shadow .25s
}
.card:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:0 10px 26px rgba(255,140,0,.25)}
.card .im{
height:110px;border-radius:10px;overflow:hidden;
background:radial-gradient(circle,rgba(255,179,0,.2),rgba(0,0,0,.45));display:grid;place-items:center
}
.card .im img{width:100%;height:100%;object-fit:contain}
.card h3{margin:10px 0 2px;font-size:16px}
.card small{color:var(--mut)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--acc)}

table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--acc);text-transform:uppercase;font-size:12px}
.scroll{overflow-x:auto}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;line-height:1.6}
input,select{
background:var(--inp);color:var(--text);border:1px solid var(--bd);
border-radius:8px;padding:10px;margin:4px 6px 4px 0;font-size:14px
}
.btn{background:var(--acc);color:#111;border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}
.tag{
display:inline-block;padding:2px 8px;border-radius:6px;
background:rgba(255,179,0,.18);color:var(--acc);font-size:12px;font-weight:700
}

footer{
position:relative;overflow:hidden;z-index:5;background:var(--hd);
border-top:2px solid var(--acc);text-align:center;padding:0 18px 40px
}
footer::before{
content:"";position:absolute;width:460px;height:460px;left:50%;top:-280px;translate:-50% 0;
background:radial-gradient(circle,rgba(255,179,0,.28),transparent 65%);pointer-events:none
}
.ftl{
height:4px;margin:0 -18px 30px;
background:linear-gradient(90deg,#ffb300,#ff4d00,#ff00d4,#00d5ff,#ffb300);
background-size:200%;animation:sh 4s linear infinite
}
.fg{
position:relative;max-width:1000px;margin:0 auto 26px;
display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:26px;text-align:start
}
.fg h4{margin:0 0 12px;color:var(--acc);text-transform:uppercase;letter-spacing:2px;font-size:13px}
.fg p{color:var(--mut);font-size:13px;line-height:1.7;margin:0}
.fg a{display:block;color:var(--text);text-decoration:none;padding:6px 0;font-size:14px;transition:.25s}
.fg a:hover{color:var(--acc);transform:translateX(6px)}
[dir=rtl] .fg a:hover{transform:translateX(-6px)}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.fg .soc a{padding:8px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--panel);font-size:13px}
.fg .soc a:hover{border-color:var(--acc);box-shadow:0 0 14px rgba(255,179,0,.4);transform:translateY(-3px)}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:#2bff6a;color:#2bff6a;animation:bp 1.6s infinite}
.flogo{
width:84px;height:84px;border-radius:18px;object-fit:cover;border:2px solid var(--acc);
box-shadow:0 0 22px rgba(255,150,0,.45);margin-bottom:14px
}
.credit{
position:relative;max-width:760px;margin:0 auto 18px;padding:22px 16px;
border-radius:16px;border:2px solid var(--acc);
background:linear-gradient(135deg,rgba(255,179,0,.16),rgba(255,77,0,.12));
box-shadow:0 0 26px rgba(255,150,0,.35)
}
.credit small{display:block;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-size:12px;margin-bottom:8px}
.credit strong{
display:block;font-size:clamp(18px,5vw,30px);font-weight:900;line-height:1.5;
background:linear-gradient(90deg,#ffb300,#ff4d00,#ffb300);background-size:200%;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite
}
@keyframes sh{to{background-position:200%}}
.fine{position:relative;color:var(--mut);font-size:12px}
.up{
position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;z-index:44;
width:46px;height:46px;border-radius:50%;border:2px solid var(--acc);background:var(--hd);
color:var(--acc);font-size:20px;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(20px);transition:.3s
}
.up.on{opacity:1;visibility:visible;transform:none}
.up:hover{background:var(--acc);color:#111}
@media(max-width:700px){
.fg{grid-template-columns:1fr;text-align:center}
.soc{justify-content:center}
.fg a:hover,[dir=rtl] .fg a:hover{transform:none}
}

:root{--hf:"Orbitron","Segoe UI",Tahoma,sans-serif;--acc2:#ff4d00}
html{scrollbar-color:var(--acc) var(--bg);scroll-behavior:smooth}
html[lang=fa]{--hf:"Vazirmatn",Tahoma,sans-serif}
html[lang=ko]{--hf:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{font-family:"Rajdhani","Segoe UI",Roboto,Tahoma,Arial,sans-serif;font-size:17px;font-weight:500}
html[lang=fa] body{font-family:"Vazirmatn",Tahoma,sans-serif;font-size:15px}
h1,h2,h3,.logo,.stat b,th,.btn,.slc,.credit strong{font-family:var(--hf)}
[dir=rtl] *{letter-spacing:0!important}
::selection{background:var(--acc);color:#111}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

header{transition:padding .3s,box-shadow .3s,border-color .3s}
header.sc{padding-block:5px;box-shadow:0 6px 24px rgba(0,0,0,.5);border-bottom-color:var(--acc)}
.brand img{box-shadow:0 0 14px rgba(255,179,0,.5);animation:lg 3s ease-in-out infinite alternate}
@keyframes lg{to{box-shadow:0 0 24px rgba(255,77,0,.85)}}
.logo b{text-shadow:0 0 12px rgba(255,179,0,.7)}

section.view.on{animation:vin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(18px)}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

.hero{position:relative;padding:38px 16px 24px;border-radius:22px;box-shadow:0 0 0 1px rgba(255,179,0,.1),0 20px 60px rgba(0,0,0,.4)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(rgba(255,179,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,179,0,.08) 1px,transparent 1px);
background-size:34px 34px;-webkit-mask:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.hero>*{position:relative}
.hero h1{font-weight:900;background:linear-gradient(90deg,#ffb300,#ff4d00,#ffb300);background-size:200%;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;filter:drop-shadow(0 0 18px rgba(255,120,0,.45))}
.hero p{font-size:19px;max-width:640px;margin:0 auto 18px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}

.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#111;border:0;border-radius:10px;
padding:12px 26px;font-size:13px;letter-spacing:1px;text-transform:uppercase;box-shadow:0 6px 20px rgba(255,120,0,.35);transition:transform .2s,box-shadow .2s,background .2s}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,120,0,.55)}
.btn:hover::after{left:130%}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc);box-shadow:none}
.btn.ghost:hover{background:var(--acc);color:#111}

.slw{position:relative}
.sl{border:1px solid rgba(255,179,0,.45);box-shadow:0 0 40px rgba(255,140,0,.25) inset,0 0 30px rgba(255,120,0,.2)}
.sl::after{content:"";position:absolute;left:0;right:0;top:0;height:200%;pointer-events:none;
background:linear-gradient(transparent 48%,rgba(255,179,0,.12) 50%,transparent 52%);animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.sl img.on{animation:zm 3.5s ease-out both}
@keyframes zm{from{transform:scale(.92)}to{transform:scale(1.04)}}
.sa{position:absolute;top:50%;translate:0 -50%;width:42px;height:42px;border-radius:50%;border:1px solid var(--acc);
background:var(--hd);color:var(--acc);font-size:22px;cursor:pointer;z-index:3;transition:.25s;padding:0}
.sa.p{left:10px}.sa.n{right:10px}
.sa:hover{background:var(--acc);color:#111}
.slc{font-size:18px}
.dots i{transition:.3s}
.dots i.on{width:26px;border-radius:6px}
.mq{-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}

h2{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:900;letter-spacing:1px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--acc),transparent)}
[dir=rtl] h2::after{background:linear-gradient(270deg,var(--acc),transparent)}

.stat{position:relative;overflow:hidden;transition:.3s}
.stat::before{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.stat:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 10px 26px rgba(255,140,0,.25)}
.stat b{font-size:28px;text-shadow:0 0 16px rgba(255,179,0,.5)}
.stat span{color:var(--mut);font-size:15px}

.card{position:relative;overflow:hidden;animation:cin .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes cin{from{opacity:0;transform:translateY(26px) scale(.96)}}
.card::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:2;pointer-events:none;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);transition:left .7s}
.card:hover::before{left:130%}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#ff004c,var(--acc),var(--acc2))}
.card .im img{transition:transform .4s}
.card:hover .im img{transform:scale(1.1) rotate(-2deg)}
.card h3{font-size:15px;letter-spacing:1px}
.card small{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);font-size:14px}
.im.noimg img{display:none}
.im.noimg::after{content:"CODM";font-size:16px;font-weight:900;opacity:.5}

table{border:1px solid var(--bd);border-radius:14px}
thead tr{background:linear-gradient(90deg,rgba(255,179,0,.22),transparent)}
tbody tr{transition:.25s}
tbody tr:hover{background:rgba(255,179,0,.1)}
tbody tr:nth-child(1){background:linear-gradient(90deg,rgba(255,215,0,.18),transparent)}
tbody tr:nth-child(-n+3) td:first-child{color:var(--acc);font-weight:900}
.kd{display:flex;align-items:center;gap:8px;min-width:120px}
.kd b{min-width:32px;color:var(--acc)}
.kd u{flex:1;height:6px;border-radius:4px;background:var(--bd);overflow:hidden;text-decoration:none}
.kd i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px;animation:gr 1s ease-out}

var io=window.IntersectionObserver?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12}):null;

(function f(t){var k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,3);b.textContent=(to*e).toFixed(d)+s;if(k<1)requestAnimationFrame(f)})(t0)}
if(window.IntersectionObserver){
var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){cnt(e.target);io2.unobserve(e.target)}})});

}

(function(){
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
var c=$("fx"),x=c.getContext("2d"),p=[],w,h;
function rs(){w=c.width=innerWidth;h=c.height=innerHeight}
rs();addEventListener("resize",rs);
for(var i=0;i<45;i++)p.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,v:Math.random()*.6+.25,a:Math.random()*6.28});
(function f(){
x.clearRect(0,0,w,h);
if(!document.hidden)p.forEach(function(o){
o.y-=o.v;o.a+=.02;o.x+=Math.sin(o.a)*.4;
if(o.y<-5){o.y=h+5;o.x=Math.random()*w}
x.beginPath();x.arc(o.x,o.y,o.r,0,6.283);
x.fillStyle="rgba(255,"+(120+o.r*30|0)+",20,"+(.25+o.r/6)+")";
x.shadowBlur=8;x.shadowColor="#ff7a00";x.fill()
});
requestAnimationFrame(f)
})()
})();

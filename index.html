<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fr="rainbow"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODM Legends Hub</title>
<style>
:root{--bg:#0a0d0a;--panel:rgba(12,16,12,.82);--text:#eef3ea;--mut:#9aa89a;--acc:#ffb300;--bd:#2b3a2b;--hd:rgba(6,9,6,.94);--inp:#0e150e;--c1:#10160f;--c2:#161d13;--c3:#0c110b;--g1:rgba(80,110,60,.35);--g2:rgba(120,60,20,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#e9efe3;--panel:rgba(255,255,255,.88);--text:#14210f;--mut:#566554;--acc:#c46f00;--bd:#b9c7b0;--hd:rgba(255,255,255,.95);--inp:#fff;--c1:#dfe8d6;--c2:#e9f0e2;--c3:#d6e1cc;--g1:rgba(120,170,90,.35);--g2:rgba(230,150,60,.3)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"Segoe UI",Roboto,Tahoma,Arial,sans-serif;background:
radial-gradient(circle at 20% 15%,var(--g1),transparent 40%),radial-gradient(circle at 80% 70%,var(--g2),transparent 45%),
repeating-linear-gradient(35deg,var(--c1) 0 40px,var(--c2) 40px 80px,var(--c3) 80px 120px),var(--bg)}
.frame{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;border:solid;border-width:6px 6px 0 6px;border-image:linear-gradient(90deg,#ff004c,#ff9500,#ffee00,#00ff6a,#00d5ff,#7a5cff,#ff00d4,#ff004c) 1;pointer-events:none;z-index:50;animation:hue 5s linear infinite;transform:translateZ(0);will-change:filter}
[data-fr="fire"] .frame{border-image:linear-gradient(90deg,#ff0000,#ff7a00,#ffd000,#ff7a00,#ff0000) 1;animation:none}
[data-fr="ice"] .frame{border-image:linear-gradient(90deg,#00e5ff,#2979ff,#e0f7ff,#2979ff,#00e5ff) 1;animation:none}
[data-fr="toxic"] .frame{border-image:linear-gradient(90deg,#39ff14,#b6ff00,#00ff9d,#b6ff00,#39ff14) 1;animation:none}
[data-fr="gold"] .frame{border-image:linear-gradient(90deg,#ffd700,#b8860b,#fff3b0,#b8860b,#ffd700) 1;animation:none}
[data-fr="purple"] .frame{border-image:linear-gradient(90deg,#7a5cff,#ff00d4,#7a5cff) 1;animation:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.burger{background:none;border:1px solid var(--bd);border-radius:8px;width:44px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;cursor:pointer}
.burger i{display:block;height:3px;background:var(--acc);border-radius:2px}
.logo{font-weight:900;letter-spacing:2px;font-size:18px;margin-inline-end:auto}.logo b{color:var(--acc)}
.ctl{position:relative}
.ib{background:var(--panel);color:var(--text);border:1px solid var(--bd);border-radius:10px;height:40px;padding:0 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.ib:hover{border-color:var(--acc)}
.pop{display:none;position:absolute;top:48px;inset-inline-end:0;min-width:170px;background:var(--hd);border:1px solid var(--acc);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pop.on{display:block}
.pop button.lg{display:block;width:100%;text-align:start;background:none;color:var(--text);border:0;padding:10px;border-radius:8px;font-size:14px;cursor:pointer}
.pop button.lg:hover,.pop button.lg.on{background:var(--acc);color:#111;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:10px}
.row:last-child{margin:0}
.mode{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:18px;cursor:pointer}
.mode.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--acc)}
.drawer{position:fixed;top:0;inset-inline-start:-300px;width:280px;height:100%;background:var(--hd);z-index:40;padding:80px 18px 20px;border-inline-end:2px solid var(--acc);transition:inset-inline-start .3s}
.drawer.open{inset-inline-start:0}
.drawer button{display:block;width:100%;text-align:start;background:var(--panel);color:var(--text);border:1px solid var(--bd);padding:14px;margin-bottom:10px;border-radius:10px;font-size:15px;cursor:pointer}
.drawer button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:22px 18px 40px;position:relative;z-index:5}
section.view{display:none}section.view.on{display:block}
.hero{text-align:center;padding:30px 10px;background:var(--panel);border-radius:16px;border:1px solid var(--bd);overflow:hidden}
.hero h1{font-size:clamp(28px,7vw,52px);margin:0 0 8px;text-transform:uppercase;letter-spacing:3px;background:linear-gradient(90deg,#ffb300,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 0 10px}
.hero svg{width:100%;max-width:560px;height:120px;color:var(--acc);filter:drop-shadow(0 0 14px rgba(255,150,0,.5))}
h2{margin:30px 0 12px;text-transform:uppercase;letter-spacing:2px;font-size:18px;border-inline-start:4px solid var(--acc);padding-inline-start:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.wp{background:radial-gradient(circle at 50% 38%,rgba(255,179,0,.2),transparent 65%),var(--panel);transition:transform .25s,border-color .25s}
.wp:hover{transform:translateY(-5px);border-color:var(--acc)}
.card svg{width:100%;height:84px}
.wp svg{color:var(--acc);filter:drop-shadow(0 0 6px rgba(255,150,0,.5))}
.card h3{margin:6px 0 2px;font-size:15px}.card small{color:var(--mut)}
.skin{background:linear-gradient(145deg,var(--k1),var(--k2));border:0;color:#fff;text-shadow:0 1px 3px #000}
.skin svg{color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.skin small{color:#fff;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--acc)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--acc);text-transform:uppercase;font-size:12px}
.scroll{overflow-x:auto}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;line-height:1.6}
input,select{background:var(--inp);color:var(--text);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 6px 4px 0;font-size:14px}
.btn{background:var(--acc);color:#111;border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,179,0,.18);color:var(--acc);font-size:12px;font-weight:700}
footer{text-align:center;padding:30px 18px 40px;position:relative;z-index:5;background:var(--hd);border-top:2px solid var(--acc)}
.credit{max-width:760px;margin:0 auto 18px;padding:22px 16px;border-radius:16px;border:2px solid var(--acc);background:linear-gradient(135deg,rgba(255,179,0,.16),rgba(255,77,0,.12));box-shadow:0 0 26px rgba(255,150,0,.35)}
.credit small{display:block;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-size:12px;margin-bottom:8px}
.credit strong{display:block;font-size:clamp(18px,5vw,30px);font-weight:900;line-height:1.5;background:linear-gradient(90deg,#ffb300,#ff4d00,#ffb300);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.fine{color:var(--mut);font-size:12px}
</style></head><body>
